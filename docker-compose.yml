# Local infrastructure for IdentityUoW: PostgreSQL + pgAdmin.
#   docker compose up -d        start
#   docker compose down         stop (data is kept in named volumes)
#   docker compose down -v      stop and wipe all data
# Every value can be overridden in a .env file (see .env.example).

name: identity-uow

services:
  postgres:
    image: postgres:17-alpine
    container_name: identity-uow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-identity_uow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - identity-uow

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: identity-uow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      # Skip the master-password prompt; acceptable for a local-only tool.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Pre-registers the "postgres" service above (imported on first start).
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - identity-uow

volumes:
  postgres-data:
  pgadmin-data:

networks:
  identity-uow:
